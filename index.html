    <link rel="apple-touch-startup-image" href="./splash/splash-1320x2868-dark.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />

    <!-- Logo w kolorze motywu od pierwszej chwili, zanim wczyta się aplikacja
         (te same proporcje co ekran startowy iPhone'a - przejście jest płynne). -->
    <style>
      html {
        background: #f4f4f6;
      }
      html[data-theme='dark'] {
        background: #121215;
      }
      .boot {
        --s: min(26vw, 120px);
        position: fixed;
        inset: 0;
        color: #1c1c1f;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      html[data-theme='dark'] .boot {
        color: #ececef;
      }
      .boot img {
        position: absolute;
        left: calc(50% - var(--s) / 2);
        top: calc(50% - var(--s) * 0.75);
        width: var(--s);
        height: var(--s);
        border-radius: 22.37%;
      }
      .boot span {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(50% + var(--s) * 0.41);
        font-size: calc(var(--s) * 0.2);
        font-weight: 600;
        text-align: center;
      }
    </style>

    <!-- Motyw i rozmiar tekstu z ustawień, zanim strona się narysuje (bez błysku jasnego ekranu).
         Pełną obsługę (zmiany w trakcie) robi usePrefs. -->
    <script>
      (function () {
        var prefs = {}
        try {
          prefs = JSON.parse(localStorage.getItem('planer.prefs') || '{}') || {}
        } catch (e) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var root = document.documentElement
        root.dataset.theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : dark ? 'dark' : 'light'
        root.dataset.motion = prefs.animations === 'off' || prefs.animations === 'system' ? prefs.animations : 'on'
        root.dataset.textSize = prefs.textSize === 'small' || prefs.textSize === 'large' ? prefs.textSize : 'normal'
        if (prefs.compact === true) root.classList.add('compact')
      })()
    </script>
  </head>
  <body>
    <!-- Zawartość znika sama, gdy aplikacja się uruchomi (React podmienia #root). -->
    <div id="root">
      <div class="boot" aria-label="Ładowanie Planera">
        <img src="./icons/icon-512.png" alt="" />
        <span>Planer</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
