<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planer</title>
    <meta name="description" content="Czytelny plan zajęć z USOS PW." />

    <!-- Podgląd linku w komunikatorach (Messenger, Discord, WhatsApp...). Adresy muszą być pełne. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planer" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:url" content="https://fizzzto-arch.github.io/planer/" />
    <meta property="og:title" content="Planer – plan zajęć z USOS" />
    <meta property="og:description" content="Czytelny plan zajęć z USOS PW." />
    <meta property="og:image" content="https://fizzzto-arch.github.io/planer/icons/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ikona Planera - kalendarz z kolorowymi zajęciami" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Planer – plan zajęć z USOS" />
    <meta name="twitter:description" content="Czytelny plan zajęć z USOS PW." />
    <meta name="twitter:image" content="https://fizzzto-arch.github.io/planer/icons/icon-512.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Po dodaniu do ekranu początkowego strona otwiera się na pełnym ekranie, jak aplikacja -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />

    <!-- Motyw i rozmiar tekstu z ustawień, zanim strona się narysuje (bez błysku jasnego ekranu).
         Pełną obsługę (zmiany w trakcie) robi usePrefs. -->
    <script>
      (function () {
        var prefs = {}
        try {
          prefs = JSON.parse(localStorage.getItem('planer.prefs') || '{}') || {}
        } catch (e) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var root = document.documentElement
        root.dataset.theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : dark ? 'dark' : 'light'
        root.dataset.motion = prefs.animations === 'off' || prefs.animations === 'system' ? prefs.animations : 'on'
        root.dataset.textSize = prefs.textSize === 'small' || prefs.textSize === 'large' ? prefs.textSize : 'normal'
        if (prefs.compact === true) root.classList.add('compact')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
