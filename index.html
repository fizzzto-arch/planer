<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planer</title>
    <meta name="description" content="Czytelny plan zajęć z USOS" />

    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Po dodaniu do ekranu początkowego strona otwiera się na pełnym ekranie, jak aplikacja -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Planer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121215" media="(prefers-color-scheme: dark)" />

    <!-- Motyw i rozmiar tekstu z ustawień, zanim strona się narysuje (bez błysku jasnego ekranu).
         Pełną obsługę (zmiany w trakcie) robi usePrefs. -->
    <script>
      (function () {
        var prefs = {}
        try {
          prefs = JSON.parse(localStorage.getItem('planer.prefs') || '{}') || {}
        } catch (e) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var root = document.documentElement
        root.dataset.theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : dark ? 'dark' : 'light'
        root.dataset.motion = prefs.animations === 'off' || prefs.animations === 'system' ? prefs.animations : 'on'
        root.dataset.textSize = prefs.textSize === 'small' || prefs.textSize === 'large' ? prefs.textSize : 'normal'
        if (prefs.compact === true) root.classList.add('compact')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
