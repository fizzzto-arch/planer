# Co 15 minut sprawdza terminy wszystkich użytkowników i wysyła przypomnienia (scripts/send-reminders.ts).
# GitHub potrafi opóźnić zaplanowane uruchomienie o kilkanaście minut - dlatego skrypt patrzy
# kilka godzin wstecz, a dziennik wysłanych pilnuje, żeby nic nie przyszło dwa razy.
name: Przypomnienia o terminach

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/send-reminders.ts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
